<header class="site-header">
  <div class="site-header-bar" [class.is-scrolled]="isScrolled()">
    <a class="brand-mark" routerLink="/" aria-label="Ir al inicio de Cipriano Gorosito">
      <span class="brand-mark-name">Cipriano Gorosito</span>
      <span class="brand-mark-tag">{{ brandTagline }}</span>
    </a>

    <nav class="desktop-nav" aria-label="Principal">
      @for (item of navigation; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="is-active"
          [routerLinkActiveOptions]="{ exact: item.path === '/' }"
          [attr.aria-current]="isActive(item.path) ? 'page' : null"
        >
          {{ item.label }}
        </a>
      }
    </nav>

    <div class="header-actions">
      <a class="button-primary desktop-cta" routerLink="/contacto">Contactar</a>

      <button
        #menuButton
        type="button"
        class="mobile-menu-button"
        [attr.aria-expanded]="menuOpen()"
        aria-controls="mobile-navigation"
        aria-label="Abrir navegación"
        (click)="toggleMenu()"
      >
        <span aria-hidden="true">{{ menuOpen() ? 'Cerrar' : 'Menú' }}</span>
      </button>
    </div>
  </div>

  @if (menuOpen()) {
    <div class="mobile-nav-backdrop" (click)="closeMenu(true)" aria-hidden="true"></div>

    <div class="mobile-nav-shell">
      <nav id="mobile-navigation" class="mobile-nav-panel" aria-label="Navegación móvil">
        @for (item of navigation; track item.path) {
          <a
            #firstMenuLink
            [routerLink]="item.path"
            routerLinkActive="is-active"
            [routerLinkActiveOptions]="{ exact: item.path === '/' }"
            [attr.aria-current]="isActive(item.path) ? 'page' : null"
            (click)="closeMenu()"
          >
            {{ item.label }}
          </a>
        }
        <a class="button-primary mobile-nav-cta" routerLink="/experiencia" (click)="closeMenu()">
          Contactar
        </a>
      </nav>
    </div>
  }
</header>
